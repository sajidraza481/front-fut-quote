name: engine

on:
  pull_request:
    paths: ["packages/quote_engine/**", "pubspec.yaml", "pubspec.lock", ".fvmrc", ".github/workflows/engine.yml"]
  push:
    branches: [main]
    paths: ["packages/quote_engine/**", "pubspec.yaml", "pubspec.lock", ".fvmrc", ".github/workflows/engine.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The pub workspace includes the Flutter app, so resolve with the pinned Flutter SDK.
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze
        working-directory: packages/quote_engine
        run: dart analyze --fatal-infos
      - name: Format
        working-directory: packages/quote_engine
        run: dart format --output=none --set-exit-if-changed .
      - name: Test
        working-directory: packages/quote_engine
        run: dart test
